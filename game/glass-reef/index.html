<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a1c">
<title>The Aether Realms — The Glass Reef</title>
<meta name="description" content="A small playable prototype from The Aether Realms: sail the Glass Reef of Ithmere under the aurora.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2l7 14-7 14-7-14z%22 fill=%22%23b8c8ff%22/%3E%3C/svg%3E">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="echoes"><span class="label">Echoes</span><span id="pips"></span></div>
    <div id="buttons">
      <button id="btnMute" title="Mute / unmute (M)" aria-label="Mute">&#9835;</button>
      <button id="btnFull" title="Fullscreen (F)" aria-label="Fullscreen">&#x26F6;</button>
    </div>
  </div>

  <div id="lore" aria-live="polite"></div>
  <div id="hint"></div>

  <div id="title" class="overlay">
    <div class="kicker">The Aether Realms</div>
    <h1>The Glass Reef</h1>
    <div class="sub">Ithmere &middot; past the edge of the frozen sea</div>
    <div id="begin" class="begin">Loading&hellip;</div>
    <div class="foot">A playable prototype &middot; sound on &middot; arrows / WASD or drag to sail</div>
  </div>

  <div id="ending" class="overlay hidden">
    <video id="endVideo" playsinline preload="none" src="assets/glass_reef_720.mp4"></video>
    <button id="skip" class="hidden">Skip &rsaquo;</button>
  </div>

  <div id="card" class="overlay hidden">
    <div class="kicker">The Aether Realms</div>
    <h2>to be continued</h2>
    <button id="again">Sail again</button>
  </div>

  <div id="flash"></div>
  <div id="rotate" class="overlay hidden"><div>Turn your device to landscape</div></div>
</div>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
